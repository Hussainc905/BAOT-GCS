name: Build ZORQ Boat GCS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        shell: bash
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"
          chmod +x "$GRADLEW_PATH"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p github-apk
          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" \
            -type f \
            -exec cp {} github-apk/ \;

          ls -lh github-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORQ-Boat-GCS-v1.0.0-debug-apk
          path: github-apk/*.apk
          if-no-files-found: error
